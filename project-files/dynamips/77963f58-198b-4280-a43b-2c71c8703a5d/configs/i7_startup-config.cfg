!
!
!
!

!
upgrade fpd auto
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname BAR
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
!
!
!
!
!
!
no ip domain lookup
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
redundancy
!
!
ip tcp synwait-time 5
! 
!
!
!
!
!
!
!
!
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 description Conexion con BAR-S1
 ip address 10.6.0.1 255.255.255.252
 duplex full
 speed 1000
 media-type gbic
 negotiation auto
!
interface Serial1/0
 description HDLC a s1/0 de BOG
 ip address 10.6.0.18 255.255.255.252
 serial restart-delay 0
!
interface Serial1/1
 description HDLC a s1/1 de SAN
 ip address 10.6.0.25 255.255.255.252
 serial restart-delay 0
!
interface Serial1/2
 no ip address
 encapsulation frame-relay
 shutdown
 serial restart-delay 0
!
interface Serial1/2.1 point-to-point
 description Frame Relay a BOG
 ip address 10.6.0.30 255.255.255.252
 frame-relay interface-dlci 202   
!
interface Serial1/2.2 point-to-point
 description Frame Relay a SAN
 ip address 10.6.0.37 255.255.255.252
 frame-relay interface-dlci 103   
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface GigabitEthernet2/0
 description Metro a CUC
 ip address 10.6.0.14 255.255.255.252
 negotiation auto
!
interface GigabitEthernet3/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet4/0
 no ip address
 shutdown
 negotiation auto
!
!
router eigrp 100
 network 10.6.0.0 0.0.0.3
 network 10.6.0.12 0.0.0.3
 network 10.6.0.16 0.0.0.3
 network 10.6.0.24 0.0.0.3
 network 10.6.0.28 0.0.0.3
 network 10.6.0.36 0.0.0.3
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
no cdp log mismatch duplex
!
!
!
control-plane
!
!
!
mgcp profile default
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
 transport input all
!
!
end
