!

!
upgrade fpd auto
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R3
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
!
!
!
!
!
!
no ip domain lookup
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
redundancy
!
!
ip tcp synwait-time 5
! 
!
!
!
!
!
!
!
!
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 description A BOG
 ip address 10.6.0.41 255.255.255.252
 duplex full
 speed 1000
 media-type gbic
 negotiation auto
!
interface Serial1/0
 description HDLC a s1/1 de R1
 ip address 200.10.10.6 255.255.255.252
 serial restart-delay 0
!
interface Serial1/1
 description HDLC a s1/1 de R2
 ip address 200.10.10.10 255.255.255.252
 serial restart-delay 0
!
interface Serial1/2
 no ip address
 encapsulation frame-relay
 serial restart-delay 0
!
interface Serial1/2.1 point-to-point
 description Frame Relay a R1
 ip address 200.10.10.18 255.255.255.252
 frame-relay interface-dlci 203   
!
interface Serial1/2.2 point-to-point
 description Frame Relay a R2
 ip address 200.10.10.22 255.255.255.252
 frame-relay interface-dlci 204   
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface GigabitEthernet2/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet3/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet4/0
 no ip address
 shutdown
 negotiation auto
!
!
router eigrp 100
 network 10.6.0.40 0.0.0.3
 redistribute bgp 35000 metric 10000 100 255 1 1500
!
router bgp 35000
 bgp log-neighbor-changes
 network 10.6.0.40 mask 255.255.255.252
 redistribute eigrp 100
 neighbor 200.10.10.5 remote-as 65000
 neighbor 200.10.10.9 remote-as 45000
 neighbor 200.10.10.21 remote-as 45000
 neighbor 255.255.255.252 remote-as 65000
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
no cdp log mismatch duplex
!
!
!
control-plane
!
!
!
mgcp profile default
!
!
!
gatekeeper
 shutdown
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
 transport input all
!
!
end
