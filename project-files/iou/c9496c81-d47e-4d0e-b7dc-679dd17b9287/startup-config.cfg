
!
version 15.5
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname SAN-S1
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
bsd-client server url https://cloudsso.cisco.com/as/token.oauth2
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
no ip icmp rate-limit unreachable
!
!
!
!
!
!
!
!


!
!
!
!
no ip domain lookup
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
cts logging verbose
!
!
!
redundancy
!
!
ip tcp synwait-time 5
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface Ethernet0/0
 description Conexion con SAN 
 ip address 10.2.64.2 255.255.255.252
!
interface Ethernet0/1
 description Conexion a SAN_Marketing
 ip address 10.1.128.1 255.255.128.0
 ip helper-address 10.4.128.3
!
interface Ethernet0/2
 description Conexion a SAN_Ingenieria
 ip address 10.2.0.1 255.255.192.0
 ip helper-address 10.4.128.3
!
interface Ethernet0/3
 description Conexion a SAN_Banda Ancha
 ip address 10.0.0.1 255.255.0.0
 ip helper-address 10.4.128.3
!
interface Ethernet1/0
 description Conexion a SAN_Servidores
 ip address 10.1.0.1 255.255.128.0
 ip helper-address 10.4.128.3
!
interface Ethernet1/1
 no ip address
 shutdown
!
interface Ethernet1/2
 no ip address
 shutdown
!
interface Ethernet1/3
 no ip address
 shutdown
!
interface Serial2/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial2/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial2/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial2/3
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/0
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/1
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial3/3
 no ip address
 shutdown
 serial restart-delay 0
!
!
router eigrp 100
 network 10.0.0.0 0.0.255.255
 network 10.1.0.0 0.0.127.255
 network 10.1.128.0 0.0.127.255
 network 10.2.0.0 0.0.63.255
 network 10.2.64.0 0.0.0.3
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
 transport input none
!
!
end
